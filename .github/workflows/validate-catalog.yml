name: Validate Catalog & Preview

on:
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate catalog and generate homepage preview
        run: |
          set -euo pipefail
          python src/cli/validate_catalog.py \
            specs/001-modular-container-platform/catalog \
            --check-certs \
            --homepage-preview \
            --output specs/001-modular-container-platform/catalog/homepage-preview.json \
            | tee validation-output.json

      - name: Generate static homepage from preview
        run: |
          set -euo pipefail
          python src/cli/generate_homepage.py \
            specs/001-modular-container-platform/catalog/homepage-preview.json \
            --output specs/001-modular-container-platform/catalog/homepage.html

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation
          path: |
            validation-output.json
            specs/001-modular-container-platform/catalog/homepage-preview.json
            specs/001-modular-container-platform/catalog/homepage.html
