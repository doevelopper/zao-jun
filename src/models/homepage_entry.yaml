$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:zao-jun:models:homepage-entry"
title: HomepageEntry
description: Homepage representation of a service
type: object
additionalProperties: false
required:
  - serviceName
  - label
  - status
  - link
properties:
  serviceName:
    type: string
    minLength: 1
  label:
    type: string
    minLength: 1
  status:
    type: string
    enum: [healthy, degraded, unavailable]
  link:
    type: string
    format: uri