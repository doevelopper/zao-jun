$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:zao-jun:models:service"
title: Service
description: Service definition for exposure via single entry point
type: object
additionalProperties: false
required:
  - name
  - domain
  - routes
  - health
  - visibility
properties:
  name:
    type: string
    minLength: 1
    description: Unique service name (globally unique across platform)
  domain:
    type: string
    minLength: 1
    description: Domain name to group this service
  routes:
    type: array
    minItems: 1
    items:
      $ref: "./route.yaml"
    description: Routing rules from edge to this service
  health:
    type: string
    enum: [healthy, degraded, unavailable]
  visibility:
    type: string
    enum: [public, restricted]
  metadata:
    type: object
    additionalProperties:
      type: string
    description: Arbitrary key/value metadata (e.g., owner)