$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:zao-jun:models:audit-event"
title: AuditEvent
description: Immutable record of configuration changes and policy enforcement
type: object
additionalProperties: false
required:
  - id
  - type
  - actor
  - timestamp
properties:
  id:
    type: string
    minLength: 1
  type:
    type: string
    enum: [create, update, remove, policy_violation]
  actor:
    type: string
    minLength: 1
  timestamp:
    type: string
    format: date-time
  details:
    type: object
    additionalProperties:
      type: string