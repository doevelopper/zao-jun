# config/nginx/html/index.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Container Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .service-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .service-card:hover {
            transform: translateY(-5px);
        }
        
        .service-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .service-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .status-healthy {
            background: #d4edda;
            color: #155724;
        }
        
        .status-unhealthy {
            background: #f8d7da;
            color: #721c24;
        }
        
        .service-link {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .service-link:hover {
            background: #5a6fd8;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Modular Container Platform</h1>
            <p>Unified edge gateway with dynamic routing and rapid service deployment</p>
        </div>
        
        <div class="services-grid" id="services-grid">
            <!-- Services will be dynamically loaded here -->
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-services">0</div>
                <div class="stat-label">Total Services</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="healthy-services">0</div>
                <div class="stat-label">Healthy Services</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="platform-uptime">0d</div>
                <div class="stat-label">Platform Uptime</div>
            </div>
        </div>
    </div>

    <script>
        // Mock service data - in production, this would come from an API
        const services = [
            {
                name: 'Traefik Dashboard',
                description: 'Load balancer and reverse proxy',
                url: 'https://traefik.localhost',
                status: 'healthy',
                domain: 'core'
            },
            {
                name: 'Health Checks',
                description: 'Service health monitoring',
                url: 'https://healthchecks.localhost',
                status: 'healthy',
                domain: 'core'
            },
            {
                name: 'RabbitMQ Management',
                description: 'Message queue management',
                url: 'https://rabbitmq.localhost',
                status: 'healthy',
                domain: 'data'
            }
        ];

        function renderServices() {
            const grid = document.getElementById('services-grid');
            grid.innerHTML = services.map(service => `
                <div class="service-card">
                    <h3>${service.name}</h3>
                    <span class="service-status status-${service.status}">
                        ${service.status.toUpperCase()}
                    </span>
                    <p>${service.description}</p>
                    <br>
                    <small>Domain: ${service.domain}</small>
                    <br><br>
                    <a href="${service.url}" class="service-link" target="_blank">Access Service</a>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-services').textContent = services.length;
            document.getElementById('healthy-services').textContent = 
                services.filter(s => s.status === 'healthy').length;
            
            // Mock uptime calculation
            const uptime = Math.floor((Date.now() - new Date('2024-01-01')) / (1000 * 60 * 60 * 24));
            document.getElementById('platform-uptime').textContent = `${uptime}d`;
        }

        // Initialize dashboard
        renderServices();
        updateStats();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            // In production, fetch real service status
            updateStats();
        }, 30000);
    </script>
</body>
</html>
