version: "3.9"

# Minimal local stack to demo the single-entry homepage with Traefik.
# Uses self-signed TLS for *.local.

name: zaojun-local

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`traefik.local`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.middlewares=security-headers@file,compress@file,local-only@file
      - traefik.http.services.api.loadbalancer.server.port=8080

  homepage:
    image: nginx:alpine
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.home.rule=Host(`home.local`)
      - traefik.http.routers.home.entrypoints=websecure
      - traefik.http.routers.home.tls=true
      - traefik.http.services.home.loadbalancer.server.port=80

  whoami:
    image: traefik/whoami:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.local`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true

  nginx:
    image: nginx:alpine
    labels:
      - traefik.enable=true
      - traefik.http.routers.nginx.rule=Host(`nginx.local`)
      - traefik.http.routers.nginx.entrypoints=websecure
      - traefik.http.routers.nginx.tls=true
      - traefik.http.services.nginx.loadbalancer.server.port=80

  fider:
    image: getfider/fider:stable
    environment:
      - SITE_URL=https://fider.local
    labels:
      - traefik.enable=true
      - traefik.http.routers.fider.rule=Host(`fider.local`)
      - traefik.http.routers.fider.entrypoints=websecure
      - traefik.http.routers.fider.tls=true
      - traefik.http.services.fider.loadbalancer.server.port=3000

  healthchecks:
    image: healthchecks/healthchecks:latest
    environment:
      - DEBUG=True
    labels:
      - traefik.enable=true
      - traefik.http.routers.hc.rule=Host(`hc.local`)
      - traefik.http.routers.hc.entrypoints=websecure
      - traefik.http.routers.hc.tls=true
      - traefik.http.services.hc.loadbalancer.server.port=8000

  ollama:
    image: ollama/ollama:latest
    # Uncomment the following lines if you have NVIDIA drivers and want GPU acceleration
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    #           driver: nvidia
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ./data/ollama:/root/.ollama
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama.rule=Host(`ollama.local`)
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ---- Atlassian Suite (QLM) ----
  confluence:
    image: atlassian/confluence-server
    environment:
      - JVM_MINIMUM_MEMORY=1024m
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - ./data/confluence:/var/atlassian/application-data/confluence
    labels:
      - traefik.enable=true
      - traefik.http.routers.confluence.rule=Host(`confluence.local`)
      - traefik.http.routers.confluence.entrypoints=websecure
      - traefik.http.routers.confluence.tls=true
      - traefik.http.routers.confluence.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.confluence.loadbalancer.server.port=8090
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  jira_core:
    image: atlassian/jira-core
    environment:
      - JVM_MINIMUM_MEMORY=1024m
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - ./data/jira-core:/var/atlassian/application-data/jira
    labels:
      - traefik.enable=true
      - traefik.http.routers.jira-core.rule=Host(`jira-core.local`)
      - traefik.http.routers.jira-core.entrypoints=websecure
      - traefik.http.routers.jira-core.tls=true
      - traefik.http.routers.jira-core.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.jira-core.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  jira:
    image: atlassian/jira-software
    environment:
      - JVM_MINIMUM_MEMORY=1024m
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - ./data/jira-software:/var/atlassian/application-data/jira
    labels:
      - traefik.enable=true
      - traefik.http.routers.jira.rule=Host(`jira.local`)
      - traefik.http.routers.jira.entrypoints=websecure
      - traefik.http.routers.jira.tls=true
      - traefik.http.routers.jira.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.jira.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  bitbucket:
    image: atlassian/bitbucket-server
    environment:
      - JVM_MINIMUM_MEMORY=1024m
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - ./data/bitbucket:/var/atlassian/application-data/bitbucket
    labels:
      - traefik.enable=true
      - traefik.http.routers.bitbucket.rule=Host(`bitbucket.local`)
      - traefik.http.routers.bitbucket.entrypoints=websecure
      - traefik.http.routers.bitbucket.tls=true
      - traefik.http.routers.bitbucket.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.bitbucket.loadbalancer.server.port=7990
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  crucible:
    image: atlassian/crucible
    volumes:
      - ./data/crucible:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.crucible.rule=Host(`crucible.local`)
      - traefik.http.routers.crucible.entrypoints=websecure
      - traefik.http.routers.crucible.tls=true
      - traefik.http.routers.crucible.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.crucible.loadbalancer.server.port=8060
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  fisheye:
    image: atlassian/fisheye
    volumes:
      - ./data/fisheye:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.fisheye.rule=Host(`fisheye.local`)
      - traefik.http.routers.fisheye.entrypoints=websecure
      - traefik.http.routers.fisheye.tls=true
      - traefik.http.routers.fisheye.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.fisheye.loadbalancer.server.port=8060
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mcp:
    image: mcp/atlassian
    # TODO: confirm the correct image and app port for this meta service
    volumes:
      - ./data/atlassian-mcp:/var/opt/atlassian-mcp
    labels:
      - traefik.enable=true
      - traefik.http.routers.mcp.rule=Host(`mcp.local`)
      - traefik.http.routers.mcp.entrypoints=websecure
      - traefik.http.routers.mcp.tls=true
      - traefik.http.routers.mcp.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.mcp.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  atlassian_nfs:
    image: atlassian/nfs-server-test
    # NFS is not HTTP; no Traefik labels by default. Keep as infra utility.
    # If you really want an HTTP route (nfs.local), add a sidecar nginx.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ---- JetBrains SDLC ----
  youtrack:
    image: jetbrains/youtrack:latest
    environment:
      - YOUTRACK_JAVA_OPTS=-Xms1024m -Xmx2048m
    volumes:
      - ./data/youtrack:/opt/youtrack/data
      - ./data/youtrack-logs:/opt/youtrack/logs
      - ./data/youtrack-backups:/opt/youtrack/backups
      - ./data/youtrack-conf:/opt/youtrack/conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.youtrack.rule=Host(`youtrack.local`)
      - traefik.http.routers.youtrack.entrypoints=websecure
      - traefik.http.routers.youtrack.tls=true
      - traefik.http.routers.youtrack.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.youtrack.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  hub:
    image: jetbrains/hub:latest
    environment:
      - HUB_JAVA_OPTS=-Xms1024m -Xmx2048m
    volumes:
      - ./data/hub:/opt/hub/data
      - ./data/hub-logs:/opt/hub/logs
      - ./data/hub-backups:/opt/hub/backups
      - ./data/hub-conf:/opt/hub/conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.hub.rule=Host(`jetbrains-hub.local`)
      - traefik.http.routers.hub.entrypoints=websecure
      - traefik.http.routers.hub.tls=true
      - traefik.http.routers.hub.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.hub.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Windows containers only; not runnable on Linux Docker.
  # youtrack_windows:
  #   image: jetbrains/youtrack-windows:latest
  #   profiles: ["windows"]
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.youtrackwin.rule=Host(`youtrack-win.local`)
  #     - traefik.http.routers.youtrackwin.entrypoints=websecure
  #     - traefik.http.routers.youtrackwin.tls=true

  # Qodana placeholders (require project mounts and commands). Disabled by default via profiles.
  qodana_python:
    image: jetbrains/qodana-python:latest
    profiles: ["qodana"]
    # Replace command with actual Qodana invocation for your project
    command: ["sleep", "infinity"]
    volumes:
      - ./data/qodana-python/project:/data/project
    labels:
      - traefik.enable=true
      - traefik.http.routers.qodana-python.rule=Host(`qodana-python.local`)
      - traefik.http.routers.qodana-python.entrypoints=websecure
      - traefik.http.routers.qodana-python.tls=true
      - traefik.http.routers.qodana-python.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.qodana-python.loadbalancer.server.port=8080

  qodana_generic:
    image: jetbrains/qodana:latest
    profiles: ["qodana"]
    command: ["sleep", "infinity"]
    volumes:
      - ./data/qodana/project:/data/project
    labels:
      - traefik.enable=true
      - traefik.http.routers.qodana.rule=Host(`qodana.local`)
      - traefik.http.routers.qodana.entrypoints=websecure
      - traefik.http.routers.qodana.tls=true
      - traefik.http.routers.qodana.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.qodana.loadbalancer.server.port=8080

  qodana_clang:
    image: jetbrains/qodana-clang:latest
    profiles: ["qodana"]
    command: ["sleep", "infinity"]
    volumes:
      - ./data/qodana-clang/project:/data/project
    labels:
      - traefik.enable=true
      - traefik.http.routers.qodana-clang.rule=Host(`qodana-clang.local`)
      - traefik.http.routers.qodana-clang.entrypoints=websecure
      - traefik.http.routers.qodana-clang.tls=true
      - traefik.http.routers.qodana-clang.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.qodana-clang.loadbalancer.server.port=8080

  qodana_cpp:
    image: jetbrains/qodana-cpp:latest
    profiles: ["qodana"]
    command: ["sleep", "infinity"]
    volumes:
      - ./data/qodana-cpp/project:/data/project
    labels:
      - traefik.enable=true
      - traefik.http.routers.qodana-cpp.rule=Host(`qodana-cpp.local`)
      - traefik.http.routers.qodana-cpp.entrypoints=websecure
      - traefik.http.routers.qodana-cpp.tls=true
      - traefik.http.routers.qodana-cpp.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.qodana-cpp.loadbalancer.server.port=8080
  openwebui:
    image: ghcr.io/open-webui/open-webui:cuda
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Open WebUI (Local)
      - AUDIO_INPUT_ALLOWED=false
      - AUDIO_OUTPUT_ALLOWED=false
      - ENABLE_OPENAI_API=false
      - ENABLE_TELEMETRY=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.openwebui.rule=Host(`openwebui.local`)
      - traefik.http.routers.openwebui.entrypoints=websecure
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.routers.openwebui.middlewares=security-headers@file,compress@file,rate-limit@file,local-only@file
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/openwebui:/app/backend/data

networks:
  default:
    name: zaojun

